  <title id="titre">Licorne rose invisible — dégradé éclairci vers la corne</title>
  <desc id="description">Composition sans poitrail, avec le museau très long. Le disque reste rose uni. Un seul dégradé diagonal continu traverse les formes de la licorne, du rose dans la crinière en bas à gauche vers le blanc au bout de la corne. Le champ de couleur est masqué par la silhouette entière, sans redémarrer dans chaque élément. Les contours, les placements et le cadrage sont identiques à la version précédente.</desc>
