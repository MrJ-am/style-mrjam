  <title id="titre">Licorne fractale étude 04 — mèches et corne</title>
  <desc id="description">Ajustements depuis l’étude 03. Le motif de neuf pièces de la mèche basse est réutilisé au front et dans deux mèches de crinière. La corne prolonge un couple de Visio par homothéties successives de rapport 0,65 vers la pointe (486,20). Trois contours canoniques inchangés ; uniquement translations, rotations, homothéties et réflexions.</desc>
